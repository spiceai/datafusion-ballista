[package]
authors = ["Apache DataFusion <dev@datafusion.apache.org>"]
description = "Apache Arrow Ballista Python Client"
edition = "2021"
homepage = "https://datafusion.apache.org/ballista/"
include = ["/src", "/ballista", "/LICENSE.txt", "pyproject.toml", "Cargo.toml", "Cargo.lock"]
license = "Apache-2.0"
name = "pyballista"
publish = false
readme = "README.md"
repository = "https://github.com/apache/datafusion-ballista"
rust-version = "1.82.0"
version = "51.0.0"

[dependencies]
async-trait = "0.1.89"
ballista = { path = "../ballista/client" }
ballista-core = { path = "../ballista/core" }
ballista-executor = { path = "../ballista/executor" }
ballista-scheduler = { path = "../ballista/scheduler" }
datafusion = { version = "52.0.0", features = ["pyarrow", "avro"] }
datafusion-proto = "52.0.0"
datafusion-python = { version = "51" }
log = { version = "0.4" }
pyo3 = { version = "0.26", features = ["extension-module", "abi3", "abi3-py310"] }
pyo3-log = "0.13"
tokio = { version = "1.48", features = ["macros", "rt", "rt-multi-thread", "sync"] }
tonic = { version = "0.14" }

[lib]
crate-type = ["cdylib"]
name = "ballista"

[build-dependencies]
pyo3-build-config = "0.26"

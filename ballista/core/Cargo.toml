[package]
authors = ["Apache DataFusion <dev@datafusion.apache.org>"]
build = "build.rs"
description = "Ballista Distributed Compute"
edition = { workspace = true }

# Exclude proto files so crates.io consumers don't need protoc
exclude = ["*.proto"]
homepage = "https://datafusion.apache.org/ballista/"
license = "Apache-2.0"
name = "ballista-core"
readme = "README.md"
repository = "https://github.com/apache/datafusion-ballista"
rust-version = { workspace = true }
version = "54.0.0"

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]

[features]
default = ["arrow-ipc-optimizations"]
arrow-ipc-optimizations = []
build-binary = ["aws-config", "aws-credential-types", "clap"]
docsrs = []
force_hash_collisions = ["datafusion/force_hash_collisions"]
spark-compat = ["dep:datafusion-spark"]
vortex = ["vortex-array", "vortex-buffer", "vortex-error", "vortex-ipc"]

[dependencies]
arrow-flight = { workspace = true }
async-trait = { workspace = true }
aws-config = { version = "1.8.18", optional = true }

aws-credential-types = { version = "1.2.0", optional = true }
bytes = { workspace = true }
chrono = { version = "0.4", default-features = false }
clap = { workspace = true, optional = true }
dashmap = "6"
datafusion = { workspace = true }
datafusion-proto = { workspace = true }
datafusion-proto-common = { workspace = true }
datafusion-spark = { workspace = true, optional = true }
futures = { workspace = true }
itertools = "0.15"
log = { workspace = true }
md-5 = { version = "^0.10.0" }
object_store = { workspace = true, features = ["aws", "azure", "http"] }
parking_lot = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true }
tonic-prost = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

# Vortex columnar format dependencies (optional)
vortex-array = { workspace = true, optional = true }
vortex-buffer = { workspace = true, optional = true }
vortex-error = { workspace = true, optional = true }
vortex-ipc = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[build-dependencies]
rustc_version = "0.4.1"
tonic-build = { workspace = true }
tonic-prost-build = { workspace = true }

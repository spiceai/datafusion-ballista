[workspace]
exclude = ["dev/msrvcheck", "python"]
members = [
    "ballista-cli",
    "ballista/api-types",
    "ballista/client",
    "ballista/core",
    "ballista/executor",
    "ballista/history",
    "ballista/scheduler",
    "benchmarks",
    "chaos-testing",
    "examples",
]
resolver = "3"

[workspace.package]
authors = ["Apache DataFusion <dev@datafusion.apache.org>"]
edition = "2024"
homepage = "https://datafusion.apache.org/ballista/"
license = "Apache-2.0"
repository = "https://github.com/apache/datafusion-ballista"
# we should try to follow datafusion version 
rust-version = "1.94.0"
version = "54.0.0"

[workspace.dependencies]
arrow = { version = "59.2.0", features = ["ipc_compression"] }
arrow-flight = { version = "59.2.0", features = ["flight-sql-experimental"] }
ballista = { path = "ballista/client", version = "54.0.0" }
ballista-api-types = { path = "ballista/api-types", version = "54.0.0" }
ballista-core = { path = "ballista/core", version = "54.0.0" }
ballista-executor = { path = "ballista/executor", version = "54.0.0" }
ballista-history = { path = "ballista/history", version = "54.0.0" }
ballista-scheduler = { path = "ballista/scheduler", version = "54.0.0" }
clap = { version = "4.5", features = ["derive", "cargo"] }

# Keep these as minor-version requirements rather than exact patch pins so a
# DataFusion patch release can be picked up with a lockfile bump alone.
# Cargo.lock records the exact patch version CI builds against.
datafusion = "55"
datafusion-cli = "55"
datafusion-functions-aggregate-common = "55"
datafusion-proto = "55"
datafusion-proto-common = "55"
datafusion-spark = "55"
datafusion-substrait = "55"

bytes = "1.5"
ctor = { version = "1.0" }
insta = "1.47"
itertools = "0.15"
mimalloc = { version = "0.1" }
object_store = { version = "0.13.2", features = ["aws", "azure"] }
ordered-float = "5"
pastey = "0.2.3"
prost = "0.14"
rstest = { version = "0.27" }
tonic = { version = "0.14" }
tonic-build = { version = "0.14", default-features = false, features = [
    "transport",
] }
tonic-prost = { version = "0.14" }
tonic-prost-build = { version = "0.14" }
tracing = "0.1"
tracing-appender = "0.2.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

async-trait = { version = "0.1" }
axum = "0.8.9"
backoff = { version = "0.4" }
chrono = { version = "0.4", default-features = false }
dashmap = { version = "6.2" }
env_logger = { version = "0.11" }
futures = { version = "0.3" }
log = { version = "0.4" }
parking_lot = { version = "0.12" }
rand = { version = "0.10" }
serde = { version = "1.0" }
serde_json = { version = "1" }
tempfile = { version = "3.27" }
tokio = { version = "1" }
tokio-stream = { version = "0.1" }
url = { version = "2.5" }
url-escape = { version = "0.1.2" }
utoipa = { version = "6.0", default-features = false, features = ["macros"] }
uuid = { version = "1.23", features = ["v4", "v7"] }

# Vortex columnar format dependencies from spiceai fork (branch: spiceai-55, vortex 0.86.1)
vortex-array = { git = "https://github.com/spiceai/vortex.git", rev = "806e48da24401eab673ef88ea93863cf8b1035e7", default-features = false }
vortex-arrow = { git = "https://github.com/spiceai/vortex.git", rev = "806e48da24401eab673ef88ea93863cf8b1035e7", default-features = false }
vortex-error = { git = "https://github.com/spiceai/vortex.git", rev = "806e48da24401eab673ef88ea93863cf8b1035e7", default-features = false }
vortex-ipc = { git = "https://github.com/spiceai/vortex.git", rev = "806e48da24401eab673ef88ea93863cf8b1035e7", default-features = false }
vortex-session = { git = "https://github.com/spiceai/vortex.git", rev = "806e48da24401eab673ef88ea93863cf8b1035e7", default-features = false }

# cargo build --profile release-lto
[profile.release-lto]
codegen-units = 1
inherits = "release"
lto = true

# the release profile takes a long time to build so we can use this profile during development to save time
# cargo build --profile release-nonlto
[profile.release-nonlto]
codegen-units = 16
debug = false
debug-assertions = false
incremental = false
inherits = "release"
lto = false
opt-level = 3
overflow-checks = false
panic = 'unwind'
rpath = false

[profile.ci]
inherits = "dev"
incremental = false
debug = false
debug-assertions = false
strip = "debuginfo"

# ci turns off debug info, etc. for dependencies to allow for smaller binaries making caching more effective
[profile.ci.package."*"]
debug = false
debug-assertions = false
strip = "debuginfo"
incremental = false

# Build profile for the TPC-H integration CI job. That job only checks that the
# distributed suite runs correctly (no timing gate), so it trades some runtime
# speed for much faster compilation: opt-level 1 keeps queries fast enough while
# compiling dependencies far quicker than the opt-level 3 release profiles. Do
# not use this for performance numbers — use release-nonlto / release-lto.
[profile.tpch-ci]
inherits = "release"
opt-level = 1
codegen-units = 256
lto = false
debug = false
debug-assertions = false
incremental = false

